name: Idea or feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: The problem it solves for you, and how you imagine it on the screen.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Your hardware (if relevant)
      placeholder: e.g. Tab5 + WiiM Ultra, or another board you'd like to port to
