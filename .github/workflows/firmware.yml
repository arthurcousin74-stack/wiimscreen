# Builds the Tab5 firmware as ONE .bin to flash at address 0x0 (USB, from the browser)
# or to upload over Wi-Fi (Réglages > Mise à jour). See README.md / LISEZMOI.md.
# Every push: Actions > run > artifact "wiim-remote-tab5".
# Tag vX.Y.Z: also publishes a GitHub Release with the .bin (pre-release while < v1.0.0).
name: firmware

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read  # only the release job below gets write access

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-tab5-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      # esptool (fourni avec la plateforme pioarduino) exige click < 8.2
      - name: Installer PlatformIO
        run: pip install platformio "click<8.2"

      - name: Tests de la logique (PC)
        run: pio test -e native

      # Version shown by the Tab5 (Réglages menu, update page): the tag, or build number + commit
      - name: Version number
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="$GITHUB_REF_NAME"; else V="${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"; fi
          echo "PLATFORMIO_BUILD_FLAGS=-DFW_VERSION=\\\"$V\\\"" >> "$GITHUB_ENV"

      - name: Compiler le firmware
        run: pio run -e tab5

      # ESP32-P4 : chargeur de démarrage à 0x2000 (et non 0x0 comme l'ESP32-S3).
      # Mêmes adresses et réglages que « pio run -t upload ».
      - name: Fusionner en un seul .bin (adresse 0x0)
        run: |
          B=.pio/build/tab5
          P=~/.platformio/packages
          mkdir -p dist
          python $P/tool-esptoolpy/esptool.py --chip esp32p4 merge-bin \
            -o dist/wiim-remote-tab5.bin \
            --flash-mode dio --flash-freq 80m --flash-size keep \
            0x2000 "$B/bootloader.bin" 0x8000 "$B/partitions.bin" \
            0xe000 $P/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 "$B/firmware.bin"
          cp LISEZMOI.md dist/
          sha256sum dist/wiim-remote-tab5.bin | tee dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: wiim-remote-tab5
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wiim-remote-tab5
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          if [[ "$GITHUB_REF_NAME" == v0.* || "$GITHUB_REF_NAME" == *-* ]]; then PRE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/wiim-remote-tab5.bin dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "wiimscreen $GITHUB_REF_NAME" $PRE \
            --notes "Firmware for the M5Stack Tab5. Flash wiim-remote-tab5.bin at address 0x0 (see README), or install it over Wi-Fi: hold the album art 3 s > Mise à jour. Only the Tab5 is tested so far. Changes: see CHANGELOG.md."
