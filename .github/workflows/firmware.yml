# Builds the Tab5 firmware as ONE .bin to flash at address 0x0 (USB, from the browser)
# or to upload over Wi-Fi (Réglages > Mise à jour). See README.md / LISEZMOI.md.
# Every push: Actions > run > artifact "wiim-remote-tab5".
# Tag vX.Y.Z: also publishes a GitHub Release with the .bin (pre-release while < v1.0.0).
name: firmware

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read  # only the release job below gets write access

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.platformio
          key: pio-tab5-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      # esptool (fourni avec la plateforme pioarduino) exige click < 8.2
      - name: Installer PlatformIO
        run: pip install "platformio==6.2.0" "click==8.1.8"

      - name: Tests de la logique (PC)
        run: pio test -e native

      # Simulator: the real app with a fake WiiM; the tour script fails the build if the app crashes or hangs
      - name: Simulateur (tour des écrans, faux WiiM)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-dev
          pio run -e sim
          timeout 120 .pio/build/sim/program --headless --quiet --reset --script tools/sim/scripts/tour.txt
          pip install "pillow==13.0.0" && python tools/preview/topng.py .pio/sim-out/*.ppm

      # The preview tool makes the docs/*.png images: keep it building
      - name: Aperçu (preview)
        run: pio run -e preview

      # Memory errors and undefined behaviour in the project's code: the tour under AddressSanitizer/UBSan
      # (separate build folder; UBSan reports inside the M5GFX library are known and do not fail the build)
      - name: Simulateur sous AddressSanitizer
        env:
          PLATFORMIO_BUILD_DIR: .pio/build-asan
          PLATFORMIO_BUILD_FLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer -g -O1
        run: |
          pio run -e sim
          ASAN_OPTIONS=detect_leaks=0 timeout 300 .pio/build-asan/sim/program --headless --quiet --reset \
              --state .pio/asan-state --out .pio/asan-out --script tools/sim/scripts/tour.txt 2> asan.log || { cat asan.log; exit 1; }
          if grep -v "libdeps" asan.log | grep -E "ERROR: AddressSanitizer|runtime error" ; then exit 1; fi

      # "Real WiiM" simulator: simulator -> relay -> mock WiiM (status, command, certificate pinning)
      - name: Simulateur et relais (WiiM simulé en HTTPS)
        run: |
          pio run -e simreal
          ./tools/relay/selftest.sh

      # Computer version (Raspberry Pi / Linux / macOS): direct connection to a mock WiiM
      - name: Version ordinateur (desktop)
        run: |
          sudo apt-get install -y -qq libssl-dev
          pio run -e desktop
          ./platform/pc/selftest.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sim-screens
          path: .pio/sim-out/*.png

      # Version shown by the Tab5 (Réglages menu, update page): the tag, or build number + commit
      - name: Version number
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="$GITHUB_REF_NAME"; else V="${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"; fi
          echo "PLATFORMIO_BUILD_FLAGS=-DFW_VERSION=\\\"$V\\\"" >> "$GITHUB_ENV"

      - name: Compiler le firmware
        run: pio run -e tab5

      # ESP32-P4 : chargeur de démarrage à 0x2000 (et non 0x0 comme l'ESP32-S3).
      # Mêmes adresses et réglages que « pio run -t upload ».
      - name: Fusionner en un seul .bin (adresse 0x0)
        run: |
          B=.pio/build/tab5
          P=~/.platformio/packages
          mkdir -p dist
          python $P/tool-esptoolpy/esptool.py --chip esp32p4 merge-bin \
            -o dist/wiim-remote-tab5.bin \
            --flash-mode dio --flash-freq 80m --flash-size keep \
            0x2000 "$B/bootloader.bin" 0x8000 "$B/partitions.bin" \
            0xe000 $P/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 "$B/firmware.bin"
          cp LISEZMOI.md dist/
          sha256sum dist/wiim-remote-tab5.bin | tee dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: wiim-remote-tab5
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: wiim-remote-tab5
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          if [[ "$GITHUB_REF_NAME" == v0.* || "$GITHUB_REF_NAME" == *-* ]]; then PRE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/wiim-remote-tab5.bin dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "wiimscreen $GITHUB_REF_NAME" $PRE \
            --notes "Firmware for the M5Stack Tab5. Flash wiim-remote-tab5.bin at address 0x0 (see README), or install it over Wi-Fi: ⚙ button > Update. Only the Tab5 is tested so far. Changes: see CHANGELOG.md."
