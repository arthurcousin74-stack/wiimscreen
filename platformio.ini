; Télécommande WiiM pour M5PaperS3 (ESP32-S3, e-ink 4,7" 960x540, tactile GT911)
; Réglages repris de la configuration documentée pour M5PaperS3 + M5Unified/M5GFX.

[platformio]
default_envs = papers3

[env:papers3]
platform = espressif32@6.10.0
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Unified@^0.2.7
    m5stack/M5GFX@^0.2.7
test_ignore = *

; Tests de la logique pure sur PC : pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17
test_build_src = no
lib_compat_mode = off
