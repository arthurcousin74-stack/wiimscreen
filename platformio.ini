; wiimscreen : télécommande WiiM sur ESP32. Seule carte testée : M5Stack Tab5 (ESP32-P4, écran 5" 1280x720, Wi-Fi par ESP32-C6).
; Autre carte : ajouter un [env:<carte>] (voir README, "Other ESP32 boards"). Tab5 : pioarduino, esp32-p4-evboard (doc M5Stack).

[platformio]
default_envs = tab5

[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
; Certificats racines pour les pochettes en HTTPS (tools/make_ca_bundle.py)
board_build.embed_files = certs/x509_crt_bundle.bin
; Version locale tirée de git (la CI la fixe elle-même)
extra_scripts = pre:tools/version.py
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
; Tab5 : M5Unified >= 0.2.23 et M5GFX >= 0.2.30 (initialisation de l'écran)
lib_deps =
    m5stack/M5Unified@0.2.26
    m5stack/M5GFX@0.2.33
test_ignore = *

; Tests de la logique pure sur PC : pio test -e native
[env:native]
platform = native
; Avertissements et sanitizers (ASan + UBSan, arrêt à la première erreur) pour lib/core et ses tests
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -g
    -fno-omit-frame-pointer
    -fsanitize=address,undefined
    -fno-sanitize-recover=undefined
test_build_src = no
lib_compat_mode = off

; Aperçu de l'interface sur PC (SDL2 requis) : voir tools/preview/preview.cpp
[env:preview]
platform = native
lib_deps = m5stack/M5GFX@0.2.33
build_src_filter = -<*> +<ui*.cpp> +<../tools/preview/preview.cpp>
build_flags =
    -std=gnu++17
    -Itools/preview/stubs
    -Isrc
    -lSDL2
test_ignore = *

; Base commune des versions PC (simulateur, simulateur « vrai WiiM », ordinateur) : couche platform/pc
; (Arduino, FreeRTOS, M5Unified sur SDL2). Avertissements activés sur le code du projet seulement.
[pc_base]
platform = native
extra_scripts = pre:tools/version.py
lib_deps = m5stack/M5GFX@0.2.33
build_flags =
    -std=gnu++17
    -Iplatform/pc/stubs
    -Iplatform/pc
    -Isrc
    -lSDL2
    -lpthread
build_src_flags = -Wall -Wextra -Wno-unused-parameter -Wno-missing-field-initializers
test_ignore = *

; Simulateur sur PC : la vraie application (src/main.cpp, src/ui.cpp) avec un faux WiiM, dans une fenêtre SDL
; (souris = toucher). Voir tools/sim/README.md. SDL2 requis (libsdl2-dev).
[env:sim]
extends = pc_base
build_src_filter = -<*> +<main.cpp> +<app*.cpp> +<ui*.cpp> +<log.cpp> +<settings.cpp>
    +<../platform/pc/pc_platform*.cpp> +<../platform/pc/pc_sound.cpp> +<../tools/sim/services.cpp> +<../tools/sim/fake_data.cpp> +<../tools/sim/fake_wiim.cpp>

; Simulateur « vrai WiiM » : le vrai code réseau (wiim_worker, wiim_client, art, favorites) ; les connexions passent
; par le relais tools/relay/wiim_relay.py lancé sur le réseau de la maison. Voir tools/sim/README.md.
[env:simreal]
extends = pc_base
build_src_filter = -<*> +<main.cpp> +<app*.cpp> +<ui*.cpp> +<log.cpp> +<settings.cpp> +<wiim_worker*.cpp> +<wiim_client.cpp>
    +<art.cpp> +<favorites.cpp>
    +<../platform/pc/pc_platform*.cpp> +<../platform/pc/pc_sound.cpp> +<../tools/sim/services.cpp> +<../tools/sim/net_relay.cpp> +<../platform/pc/pc_http_fs.cpp>
build_flags =
    ${pc_base.build_flags}
    -DSIM_REAL

; Ordinateur (Raspberry Pi, Linux, macOS) : la vraie application et le vrai code réseau, en direct sur le réseau
; (sockets + OpenSSL, découverte SSDP). Fenêtre ou plein écran, écran tactile. SDL2 et OpenSSL requis
; (libsdl2-dev libssl-dev). Voir docs/DESKTOP.md.
[env:desktop]
extends = pc_base
build_src_filter = -<*> +<main.cpp> +<app*.cpp> +<ui*.cpp> +<log.cpp> +<settings.cpp> +<wiim_worker*.cpp> +<wiim_client.cpp>
    +<art.cpp> +<favorites.cpp> +<discovery.cpp>
    +<../platform/pc/pc_platform*.cpp> +<../platform/pc/pc_http_fs.cpp> +<../platform/pc/net_direct.cpp>
    +<../platform/pc/desktop_services.cpp> +<../platform/pc/pc_sound.cpp>
build_flags =
    ${pc_base.build_flags}
    -O2
    -DPC_DESKTOP
    -lssl
    -lcrypto
