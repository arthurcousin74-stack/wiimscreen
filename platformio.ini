; wiimscreen : télécommande WiiM sur ESP32. Seule carte testée : M5Stack Tab5 (ESP32-P4, écran 5" 1280x720, Wi-Fi par ESP32-C6).
; Autre carte : ajouter un [env:<carte>] (voir README, "Other ESP32 boards"). Tab5 : pioarduino, esp32-p4-evboard (doc M5Stack).

[platformio]
default_envs = tab5

[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
; Certificats racines pour les pochettes en HTTPS (tools/make_ca_bundle.py)
board_build.embed_files = certs/x509_crt_bundle.bin
; Version locale tirée de git (la CI la fixe elle-même)
extra_scripts = pre:tools/version.py
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
; Tab5 : M5Unified >= 0.2.23 et M5GFX >= 0.2.30 (initialisation de l'écran)
lib_deps =
    m5stack/M5Unified@0.2.26
    m5stack/M5GFX@0.2.33
test_ignore = *

; Tests de la logique pure sur PC : pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17
test_build_src = no
lib_compat_mode = off

; Aperçu de l'interface sur PC (SDL2 requis) : voir tools/preview/preview.cpp
[env:preview]
platform = native
lib_deps = m5stack/M5GFX@0.2.33
build_src_filter = -<*> +<ui.cpp> +<../tools/preview/preview.cpp>
build_flags =
    -std=gnu++17
    -Itools/preview/stubs
    -Isrc
    -lSDL2
test_ignore = *
