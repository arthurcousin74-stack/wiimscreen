; Télécommande WiiM pour M5PaperS3 (ESP32-S3, e-ink 4,7" 960x540, tactile GT911)
; Réglages repris de la configuration documentée pour M5PaperS3 + M5Unified/M5GFX.

[platformio]
default_envs = papers3

[env:papers3]
platform = espressif32@6.10.0
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
; Certificats racines pour les pochettes en HTTPS (tools/make_ca_bundle.py)
board_build.embed_files = certs/x509_crt_bundle.bin
; Le cœur Arduino compile en C++11 par défaut ; lib/core utilise C++14/17
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Unified@^0.2.7
    m5stack/M5GFX@^0.2.7
test_ignore = *

; Tests de la logique pure sur PC : pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17
test_build_src = no
lib_compat_mode = off

; Aperçu de l'interface sur PC (SDL2 requis) : voir tools/preview/preview.cpp
[env:preview]
platform = native
lib_deps = m5stack/M5GFX@^0.2.7
build_src_filter = -<*> +<ui.cpp> +<../tools/preview/preview.cpp>
build_flags =
    -std=gnu++17
    -Itools/preview/stubs
    -Isrc
    -lSDL2
test_ignore = *
